<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>QQ飞行棋 3D — QQ Aeroplane Chess 3D</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230284c7' stroke='%23ffffff' stroke-width='4'/%3E%3Cpath d='M32 10 L38 28 L54 32 L38 36 L32 54 L26 36 L10 32 L26 28 Z' fill='%23fbbf24'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23ef4444'/%3E%3C/svg%3E"
  />
  <script>
    (function () {
      if (window.__E2E_ERROR_TRACKER__) return;
      var tracker = {
        jsErrors: [],
        unhandledRejections: [],
        resourceErrors: []
      };
      Object.defineProperty(window, '__E2E_ERROR_TRACKER__', {
        value: tracker,
        writable: false,
        configurable: false,
        enumerable: false
      });
      window.addEventListener(
        'error',
        function (ev) {
          try {
            if (ev && ev.target && ev.target !== window) {
              var tag = String(ev.target.tagName || 'UNKNOWN');
              var src = String(ev.target.src || ev.target.href || '');
              tracker.resourceErrors.push({ tag: tag, src: src, time: Date.now() });
            } else {
              tracker.jsErrors.push({
                message: String(ev && ev.message ? ev.message : ev),
                filename: String((ev && ev.filename) || ''),
                lineno: Number((ev && ev.lineno) || 0),
                colno: Number((ev && ev.colno) || 0),
                stack: String((ev && ev.error && ev.error.stack) || '')
              });
            }
          } catch (_) {}
        },
        true
      );
      window.addEventListener('unhandledrejection', function (ev) {
        try {
          var r = ev ? ev.reason : 'unknown';
          tracker.unhandledRejections.push({
            reason: String((r && (r.stack || r.message)) || r),
            time: Date.now()
          });
        } catch (_) {}
      });
    })();
  </script>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <canvas id="board-canvas" data-testid="board-canvas"></canvas>
  <div id="ui-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
